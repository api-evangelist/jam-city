aid: jam-city
name: Jam City
description: 'Jam City is a Culver City, California mobile entertainment company founded
  in 2010 by MySpace co-founders Chris DeWolfe and Aber Whitcomb (with Josh Yguado),
  now led by CEO Simon Sim. It develops and publishes free-to-play mobile games across
  puzzle, casual and narrative RPG genres — including the Cookie Jam and Panda Pop
  franchises and licensed titles such as Harry Potter: Hogwarts Mystery, Disney Emoji
  Blitz and Family Guy: The Quest for Stuff — built with partners including Disney
  and Warner Bros. Games. The company reports over $4 billion in aggregate lifetime
  bookings and nearly 1.5 billion downloads across studios in Los Angeles, Burbank,
  San Diego, San Francisco, Buenos Aires, Montevideo and Toronto. Jam City is a consumer
  games publisher: it distributes through the Apple App Store and Google Play and,
  as of this profile, publishes no public developer portal, API documentation, or
  machine-readable API contract.'
